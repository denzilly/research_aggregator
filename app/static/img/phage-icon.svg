<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 102" fill="none" stroke="#8ed5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Icosahedral head, drawn as a hexagonal bipyramid -->
  <polygon points="70,28 60,45.3 40,45.3 30,28 40,10.7 60,10.7"/>
  <line x1="50" y1="6" x2="70" y2="28"/>
  <line x1="50" y1="6" x2="60" y2="45.3"/>
  <line x1="50" y1="6" x2="40" y2="45.3"/>
  <line x1="50" y1="6" x2="30" y2="28"/>
  <line x1="50" y1="6" x2="40" y2="10.7"/>
  <line x1="50" y1="6" x2="60" y2="10.7"/>
  <line x1="50" y1="52" x2="70" y2="28"/>
  <line x1="50" y1="52" x2="60" y2="45.3"/>
  <line x1="50" y1="52" x2="40" y2="45.3"/>
  <line x1="50" y1="52" x2="30" y2="28"/>
  <line x1="50" y1="52" x2="40" y2="10.7"/>
  <line x1="50" y1="52" x2="60" y2="10.7"/>

  <!-- Collar -->
  <line x1="46" y1="52" x2="46" y2="58"/>
  <line x1="54" y1="52" x2="54" y2="58"/>
  <line x1="44" y1="58" x2="56" y2="58"/>

  <!-- Coiled tail sheath -->
  <polyline points="46,58 54,61 46,64 54,67 46,70 54,73 50,78"/>

  <!-- Baseplate + spikes -->
  <line x1="34" y1="78" x2="66" y2="78"/>
  <line x1="46" y1="78" x2="46" y2="83"/>
  <line x1="50" y1="78" x2="50" y2="84"/>
  <line x1="54" y1="78" x2="54" y2="83"/>

  <!-- Tail fibers -->
  <polyline points="40,78 30,86 22,96"/>
  <polyline points="36,77 20,85 12,96"/>
  <polyline points="32,76 12,84 4,96"/>
  <polyline points="60,78 70,86 78,96"/>
  <polyline points="64,77 80,85 88,96"/>
  <polyline points="68,76 88,84 96,96"/>

  <!-- Surface line -->
  <line x1="2" y1="97" x2="98" y2="97" stroke="#87929a"/>
  <line x1="6" y1="97" x2="3" y2="100" stroke="#87929a"/>
  <line x1="16" y1="97" x2="13" y2="100" stroke="#87929a"/>
  <line x1="26" y1="97" x2="23" y2="100" stroke="#87929a"/>
  <line x1="36" y1="97" x2="33" y2="100" stroke="#87929a"/>
  <line x1="46" y1="97" x2="43" y2="100" stroke="#87929a"/>
  <line x1="56" y1="97" x2="53" y2="100" stroke="#87929a"/>
  <line x1="66" y1="97" x2="63" y2="100" stroke="#87929a"/>
  <line x1="76" y1="97" x2="73" y2="100" stroke="#87929a"/>
  <line x1="86" y1="97" x2="83" y2="100" stroke="#87929a"/>
  <line x1="96" y1="97" x2="93" y2="100" stroke="#87929a"/>
</svg>
