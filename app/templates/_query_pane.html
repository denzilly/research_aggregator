<div class="sidebar-section">
  <h3 class="sidebar-section-title">Queries</h3>
  <ul class="sidebar-list">
    <li class="sidebar-item {{ 'active' if not active_query }}">
      <a href="{{ url_for('main.deactivate_query') }}">
        <span>All queries</span>
        <span class="unread-badge" data-unread-badge="all" {{ "hidden" if not all_queries_unread_count }}>{{ all_queries_unread_count }}</span>
      </a>
    </li>
    {% for q in queries %}
    {% set unread = query_unread_counts.get(q.id, 0) %}
    <li class="sidebar-item {{ 'active' if active_query and active_query.id == q.id }}">
      <a href="{{ url_for('main.activate_query', query_id=q.id) }}">
        <span class="sidebar-item-name">{{ q.name }}</span>
        <span class="unread-badge" data-unread-badge="{{ q.id }}" {{ "hidden" if not unread }}>{{ unread }}</span>
      </a>
    </li>
    {% else %}
    <li class="sidebar-empty">No queries yet &mdash; <a href="{{ url_for('main.queries_page') }}">add one</a>.</li>
    {% endfor %}
  </ul>
</div>
