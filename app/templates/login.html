<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — phageDB</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/phage-icon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="settings-block login-card">
      <div class="topbar-brand">
        <span class="topbar-brand-mark"><img src="{{ url_for('static', filename='img/phage-icon.svg') }}" alt=""></span>
        <span class="topbar-brand-text">Phage<span>DB</span></span>
      </div>
      <p class="hint">Enter the password to continue.</p>
      <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="password" name="password" placeholder="Password" autofocus>
        <button type="submit">Sign in</button>
        {% if error %}<span class="flash" style="color: var(--error)">{{ error }}</span>{% endif %}
      </form>
    </div>
  </div>
</body>
</html>
